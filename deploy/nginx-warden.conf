server {
    listen 80;
    listen [::]:80;
    server_name warden.gudman.xyz;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name warden.gudman.xyz;

    ssl_certificate /etc/letsencrypt/live/warden.gudman.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/warden.gudman.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'none'; upgrade-insecure-requests" always;

    client_max_body_size 1m;

    # x402 402 PAYMENT-REQUIRED response headers (especially /variant-audit, whose
    # accepts/output schema is the largest) exceed nginx's default 4k proxy buffer,
    # so a paid route would answer 502 "upstream sent too big header". Size the
    # proxy header buffers up for every upstream location in this server.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 16k;

    root /opt/warden-site;
    index index.html;

    location = /scan {
        proxy_pass http://127.0.0.1:8031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /audit {
        proxy_pass http://127.0.0.1:8031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /harden {
        proxy_pass http://127.0.0.1:8031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /variant-audit {
        proxy_pass http://127.0.0.1:8031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A variant audit probes sequentially and bounds itself; the deep tier
        # may legitimately run for minutes. nginx's 60s default would cut a paid
        # run off at the proxy and hand the buyer a 504 for work they paid for,
        # so the app's own whole-run timeout has to be the one that governs.
        proxy_read_timeout 450s;
        proxy_send_timeout 450s;
    }

    # Report retrieval and its derived badge. The exact-match block above still
    # wins for the paid route itself; this only matches a 64-hex report id
    # beneath it. No trailing slash is admitted: no route matches that form, and
    # Starlette would answer it with a 307 whose authority comes from the
    # client's Host header.
    location ~ "^/variant-audit/[a-f0-9]{64}(/badge(\.svg)?)?$" {
        proxy_pass http://127.0.0.1:8031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/badge/[^/]+/?$ {
        proxy_pass http://127.0.0.1:8031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /apa/ {
        proxy_pass http://127.0.0.1:8031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/apa-issuer.json {
        proxy_pass http://127.0.0.1:8031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location = /data/service-monitor.json {
        alias /opt/warden/monitor/service-monitor.json;
        default_type application/json;
    }

    location = /data/apa-log-anchor.json {
        alias /opt/warden/anchor/apa-log-anchor.json;
        default_type application/json;
    }

    location = /data/apa-log-anchor-history.json {
        alias /opt/warden/anchor/apa-log-anchor-history.json;
        default_type application/json;
    }

    location /data/ {
        try_files $uri =404;
    }

    location = /.well-known/warden-consent {
        # The variant-audit / auditor consent check reads the body with identity
        # encoding and rejects any content-encoding != identity, so a gzipped
        # marker fails the check (Warden could not be audited by a gzip-capable
        # client, including itself). Force identity for this marker.
        gzip off;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /agents {
        try_files /agents/index.html =404;
    }

    location = /agents/ {
        try_files /agents/index.html =404;
    }

    location ~ ^/agents/([0-9]+)/?$ {
        try_files /agents/$1.html =404;
    }

    location = /docs {
        try_files /docs/index.html =404;
    }

    location = /docs/ {
        try_files /docs/index.html =404;
    }

    location ~ ^/docs/([a-z0-9-]+)/?$ {
        try_files /docs/$1.html =404;
    }

    location = /badges {
        try_files /badges.html =404;
    }

    location = /badges/ {
        try_files /badges.html =404;
    }

    location ~ "^/badges/[a-f0-9]{16}/?$" {
        try_files /badge.html =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html =404;
    }
}

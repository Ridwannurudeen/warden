[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warden"
version = "0.1.0"
description = "Deterministic payload firewall and pre-listing auditor for agent services."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    # onchain_attestation/onchain_anchor import these directly. They also arrive
    # transitively through okxweb3-app-x402[evm], but relying on that would break
    # both modules at import if the extra ever stopped pulling them.
    "eth-account==0.13.7",
    "fastapi==0.137.1",
    "fastmcp==3.4.2",
    "httpx==0.28.1",
    "idna==3.18",
    "okxweb3-app-x402[fastapi,evm]==0.1.0",
    "pydantic==2.13.4",
    "uvicorn==0.49.0",
    "web3==7.16.0",
]

[tool.setuptools.packages.find]
include = ["audit", "warden*"]

[tool.setuptools.package-data]
"audit" = ["warden-core-http-2026-07.json"]
"warden" = ["corpus_fingerprint.txt"]
"warden.analyzers" = ["bip39_words.txt"]
"warden.scanner" = ["learned_scorer.json"]

[tool.setuptools.data-files]
"." = ["THIRD-PARTY-NOTICES"]
"corpus" = ["corpus/license-manifest.json"]
"spec" = [
    "spec/corpus-source-allowlist-v1.json",
    "spec/taxonomy-map-v1.json",
]
"spec/schemas" = [
    "spec/schemas/model-calibration-capture-v1.schema.json",
    "spec/schemas/model-threshold-candidate-v1.schema.json",
]

[project.optional-dependencies]
dev = [
    # spec/run_conformance.py and the conformance tests import jsonschema; it was
    # previously only present transitively (via mcp).
    "jsonschema==4.26.0",
    "pip-audit==2.10.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.17",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"warden/scanner/scanner.py" = ["F401"]

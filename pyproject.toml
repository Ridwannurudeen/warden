[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warden"
version = "0.1.0"
description = "Deterministic payload firewall and pre-listing auditor for agent services."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "fastapi==0.137.1",
    "fastmcp==3.4.2",
    "httpx==0.28.1",
    "okxweb3-app-x402[fastapi,evm]==0.1.0",
    "pydantic==2.13.4",
    "uvicorn==0.49.0",
]

[tool.setuptools.packages.find]
include = ["warden*"]

[tool.setuptools.package-data]
"warden.analyzers" = ["bip39_words.txt"]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.17",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"warden/scanner/scanner.py" = ["F401"]

name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -e "sdk/python[dev,langchain,llamaindex]"
      - run: python scripts/build_site.py
      - run: python scripts/build_index.py
      - name: Verify distributable wheel and local x402 settlement
        run: python -m pytest -q tests/test_r4_distribution.py tests/test_r4_x402_settlement.py
      - run: python spec/verify_apa.py --selftest
      - run: ruff check .
      - run: python -m pytest -q
      - run: python -m pytest -q sdk/python/tests
      - run: node --test tests/js/*.test.js
      - run: npm ci
        working-directory: sdk/ts
      - run: npm test
        working-directory: sdk/ts
      - run: npm run build
        working-directory: sdk/ts
      - run: npm pack --dry-run
        working-directory: sdk/ts

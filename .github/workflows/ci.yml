name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned TruffleHog
        shell: bash
        env:
          TRUFFLEHOG_VERSION: "3.95.9"
          TRUFFLEHOG_SHA256: f6d1106b85107d79527ed7a5b98b592beadd8b770dc3c9e8c1ad99e1b2cf127e
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trufflehog.tar.gz"
          binary_dir="$RUNNER_TEMP/trufflehog-bin"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$TRUFFLEHOG_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$binary_dir"
          tar --extract --gzip --file "$archive" --directory "$binary_dir" trufflehog
          chmod 0755 "$binary_dir/trufflehog"
          test "$("$binary_dir/trufflehog" --version)" = "trufflehog ${TRUFFLEHOG_VERSION}"
          printf 'TRUFFLEHOG_BIN=%s\n' "$binary_dir/trufflehog" >> "$GITHUB_ENV"
      - name: Scan full current history for secrets
        shell: bash
        env:
          TRUFFLEHOG_ALLOWED_DETECTOR: "URI"
          TRUFFLEHOG_ALLOWED_COMMIT: "fea29c05936fde91e227f6a08aee49b7f613d37c"
          TRUFFLEHOG_ALLOWED_FILE: "tests/test_reliability_operations.py"
          TRUFFLEHOG_ALLOWED_LINE: "422"
        run: |
          set -euo pipefail
          findings="$RUNNER_TEMP/trufflehog-findings.jsonl"
          scan_stderr="$RUNNER_TEMP/trufflehog-scan.stderr"
          set +e
          "$TRUFFLEHOG_BIN" git "file://${GITHUB_WORKSPACE}" \
            --branch HEAD \
            --fail \
            --fail-on-scan-errors \
            --no-update \
            --json \
            --results=verified,unknown \
            --exclude-globs=benchmark/held_out_benign.jsonl,sdk/python/tests/test_ph5_reverse_proxy.py,tests/test_apa_browser_verifier.py,tests/test_variant_audit.py \
            >"$findings" 2>"$scan_stderr"
          scan_status=$?
          set -e
          if [ "$scan_status" -ne 0 ] && [ "$scan_status" -ne 183 ]; then
            stderr_lines="$(wc -l <"$scan_stderr" | tr -d ' ')"
            printf 'TruffleHog scan failed with status %s (%s diagnostic lines withheld).\n' \
              "$scan_status" "$stderr_lines" >&2
            exit "$scan_status"
          fi
          python - "$findings" <<'PY'
          import json
          import os
          import sys

          allowed_finding = (
              os.environ["TRUFFLEHOG_ALLOWED_DETECTOR"],
              os.environ["TRUFFLEHOG_ALLOWED_COMMIT"],
              os.environ["TRUFFLEHOG_ALLOWED_FILE"],
              os.environ["TRUFFLEHOG_ALLOWED_LINE"],
          )
          known_finding_count = 0
          unexpected_findings = []
          with open(sys.argv[1], encoding="utf-8") as handle:
              for line in handle:
                  if not line.strip():
                      continue
                  record = json.loads(line)
                  git = record.get("SourceMetadata", {}).get("Data", {}).get("Git", {})
                  fingerprint = (
                      str(record.get("DetectorName", "")),
                      str(git.get("commit", "")),
                      str(git.get("file", "")),
                      str(git.get("line", "")),
                  )
                  if fingerprint == allowed_finding:
                      known_finding_count += 1
                  else:
                      unexpected_findings.append(
                          {
                              "detector": fingerprint[0],
                              "commit": fingerprint[1],
                              "file": fingerprint[2],
                              "line": fingerprint[3],
                              "verified": bool(record.get("Verified")),
                          }
                      )

          if known_finding_count != 1:
              print(
                  "Expected exactly one immutable synthetic finding; "
                  f"observed {known_finding_count}.",
                  file=sys.stderr,
              )
          for finding in unexpected_findings:
              print(json.dumps(finding, sort_keys=True), file=sys.stderr)
          if known_finding_count != 1 or unexpected_findings:
              raise SystemExit(1)
          print("TruffleHog full-history scan passed with one immutable synthetic fixture.")
          PY
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Install hash-locked Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install local packages without resolving dependencies
        run: python -m pip install --no-deps --no-build-isolation -e . -e sdk/python
      - run: python scripts/build_site.py
      - run: python scripts/build_index.py
      - name: Verify clean root-wheel install
        run: python -m pytest -q tests/test_r4_distribution.py
      - name: Verify local x402 settlement
        run: python -m pytest -q tests/test_r4_x402_settlement.py
      - name: Build Python SDK distributions
        run: python -m build --no-isolation
        working-directory: sdk/python
      - name: Validate Python SDK distributions
        run: python -m twine check dist/*
        working-directory: sdk/python
      - name: Audit hash-locked Python dependencies
        run: python -m pip_audit --require-hashes -r requirements.lock --disable-pip
      - name: Verify APA reference implementation
        run: python spec/verify_apa.py --selftest
      - name: Verify APA conformance vectors
        run: python spec/run_conformance.py
      - name: Verify adversarial variant packs are deterministic and separated
        run: python scripts/verify_variant_packs.py
      - name: Lint Python
        run: ruff check .
      - name: Test Warden
        run: python -m pytest -q
      - name: Test Python SDK
        run: python -m pytest -q sdk/python/tests
      - name: Test browser JavaScript
        run: node --test tests/js/*.test.js
      - name: Install TypeScript SDK
        run: npm ci
        working-directory: sdk/ts
      - name: Audit TypeScript SDK dependencies
        run: npm audit --audit-level=high
        working-directory: sdk/ts
      - name: Test TypeScript SDK
        run: npm test
        working-directory: sdk/ts
      - name: Build TypeScript SDK
        run: npm run build
        working-directory: sdk/ts
      - name: Validate TypeScript SDK package
        run: npm pack --dry-run
        working-directory: sdk/ts
  gateway-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Build the gateway container and run the fail-closed smoke gate
        run: sh scripts/smoke_gateway.sh

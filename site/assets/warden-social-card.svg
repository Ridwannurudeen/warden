<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Warden — Action Firewall for Autonomous Agents</title>
  <desc id="description">A poisoned payment instruction stops at Warden's deterministic action gate before a transfer.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#9b9280" opacity="0.18" />
    </pattern>
    <radialGradient id="halo" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#e3b264" stop-opacity="0.17" />
      <stop offset="0.72" stop-color="#e3b264" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3b264" stop-opacity="0.2" />
      <stop offset="1" stop-color="#e3b264" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0b0a08" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#halo)" />
  <path d="M72 48H1128V582H72Z" fill="none" stroke="#2d2820" />

  <g font-family="Bahnschrift, Aptos, Segoe UI, sans-serif">
    <text x="112" y="112" fill="#f2cd8d" font-size="18" font-weight="700" letter-spacing="4">WARDEN / PRE-ACTION CONTROL</text>
    <text x="112" y="205" fill="#f6f1e7" font-size="68" font-weight="650" letter-spacing="-2">Stop poisoned output</text>
    <text x="112" y="277" fill="#f6f1e7" font-size="68" font-weight="650" letter-spacing="-2">before an agent acts.</text>
    <text x="114" y="330" fill="#c3baa9" font-size="23">Deterministic action firewall for autonomous agents.</text>
  </g>

  <g transform="translate(112 382)">
    <rect width="976" height="120" rx="8" fill="#14110c" stroke="#4c4433" />
    <text x="24" y="31" fill="#9b9280" font-family="Cascadia Code, Consolas, monospace" font-size="13" letter-spacing="2">UNTRUSTED PAYMENT OUTPUT</text>
    <text x="24" y="73" fill="#f6f1e7" font-family="Cascadia Code, Consolas, monospace" font-size="19">send funds → 0x2222…2222</text>
    <line x1="330" y1="61" x2="456" y2="61" stroke="url(#trace)" stroke-width="3" />
    <circle cx="456" cy="61" r="5" fill="#e3b264" />
    <path d="M482 18V102M692 18V102" fill="none" stroke="#e3b264" stroke-width="2" />
    <rect x="507" y="27" width="160" height="68" rx="5" fill="#2a1018" stroke="#ff6578" />
    <text x="587" y="54" fill="#ff9cab" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">BLOCK</text>
    <text x="587" y="77" fill="#f6f1e7" font-family="Cascadia Code, Consolas, monospace" font-size="14" text-anchor="middle">DRAIN_ADDRESS</text>
    <line x1="692" y1="61" x2="788" y2="61" stroke="#ff6578" stroke-width="2" stroke-dasharray="5 6" />
    <path d="M788 48L814 74M814 48L788 74" stroke="#ff6578" stroke-width="3" />
    <text x="838" y="57" fill="#f6f1e7" font-family="Bahnschrift, Aptos, sans-serif" font-size="17" font-weight="650">TRANSFER STOPPED</text>
    <text x="838" y="79" fill="#9b9280" font-family="Cascadia Code, Consolas, monospace" font-size="12">before wallet execution</text>
  </g>

  <g font-family="Cascadia Code, Consolas, monospace" font-size="13" letter-spacing="1">
    <text x="112" y="552" fill="#9b9280">ALLOW / SANITIZE / BLOCK</text>
    <text x="1088" y="552" fill="#9b9280" text-anchor="end">OKX.AI #3808 · x402 · X LAYER</text>
  </g>
</svg>

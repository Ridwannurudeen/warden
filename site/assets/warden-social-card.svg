<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Warden — Pre-action security for agent systems</title>
  <desc id="description">Warden checks an agent request at the action boundary, withholds an unsafe transfer, and keeps a signed decision record.</desc>

  <rect width="1200" height="630" fill="#0b0a07" />
  <rect x="56" y="48" width="1088" height="534" rx="18" fill="#14110b" stroke="#463f2c" />

  <g transform="translate(96 88)">
    <rect width="44" height="44" rx="10" fill="#1b1710" stroke="#463f2c" />
    <path d="M12 13L18 31L22 21L26 31L32 13" fill="none" stroke="#f6f0e1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M35 9V35" stroke="#d7aa49" stroke-width="3" stroke-linecap="round" />
    <text x="60" y="30" fill="#f6f0e1" font-family="Aptos, Segoe UI, sans-serif" font-size="24" font-weight="650">Warden</text>
    <text x="1008" y="29" fill="#bfb6a2" font-family="Cascadia Code, Consolas, monospace" font-size="13" text-anchor="end" letter-spacing="1.5">PRE-ACTION SECURITY</text>
  </g>

  <g font-family="Aptos, Segoe UI, sans-serif">
    <text x="96" y="240" fill="#f6f0e1" font-size="66" font-weight="650" letter-spacing="-2.4">A security boundary</text>
    <text x="96" y="312" fill="#f6f0e1" font-size="66" font-weight="650" letter-spacing="-2.4">for agent actions.</text>
    <text x="98" y="363" fill="#bfb6a2" font-size="22">Gate the action. Keep an independently inspectable record.</text>
  </g>

  <g transform="translate(96 416)">
    <rect width="1008" height="112" rx="12" fill="#1b1710" stroke="#2c2619" />

    <g font-family="Cascadia Code, Consolas, monospace">
      <text x="22" y="30" fill="#8d8472" font-size="11" letter-spacing="1.3">PROPOSED ACTION</text>
      <text x="22" y="69" fill="#f6f0e1" font-size="16">transfer → 0x2222…2222</text>
    </g>

    <line x1="310" y1="56" x2="392" y2="56" stroke="#463f2c" stroke-width="2" />
    <path d="M382 49L392 56L382 63" fill="none" stroke="#463f2c" stroke-width="2" />

    <path d="M420 18V94" stroke="#d7aa49" stroke-width="3" />
    <g font-family="Aptos, Segoe UI, sans-serif">
      <text x="444" y="43" fill="#bfb6a2" font-size="12" font-weight="650" letter-spacing="1.4">WARDEN BOUNDARY</text>
      <text x="444" y="70" fill="#f6f0e1" font-size="17" font-weight="600">Recipient manipulation detected</text>
    </g>

    <line x1="723" y1="56" x2="785" y2="56" stroke="#463f2c" stroke-width="2" />

    <rect x="808" y="25" width="86" height="30" rx="15" fill="#2a1410" stroke="#7d3a30" />
    <text x="851" y="45" fill="#ef9a86" font-family="Cascadia Code, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">BLOCK</text>
    <text x="808" y="79" fill="#f6f0e1" font-family="Aptos, Segoe UI, sans-serif" font-size="15" font-weight="600">Transfer withheld</text>

    <path d="M926 18V94" stroke="#2c2619" />
    <text x="949" y="43" fill="#8d8472" font-family="Cascadia Code, Consolas, monospace" font-size="11" letter-spacing="1.2">RECORD</text>
    <text x="949" y="70" fill="#d7aa49" font-family="Aptos, Segoe UI, sans-serif" font-size="15" font-weight="600">Signed</text>
  </g>

  <text x="1104" y="558" fill="#8d8472" font-family="Cascadia Code, Consolas, monospace" font-size="12" text-anchor="end">ALLOW  /  SANITIZE  /  BLOCK</text>
</svg>
